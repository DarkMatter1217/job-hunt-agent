# Companies whose job boards the harvester checks every run.
# tier 1 = LLM/applied-ML intern or co-op roles in Canada open to MSc students (checked live or in the last year)
# tier 2 = regular AI/ML co-ops or strong AI orgs, but a weaker or less frequent match
# tier 3 = watch list (adjacent roles, US/India, or rare interns)
# ats: greenhouse | lever | ashby | smartrecruiters | workable | workday | recruitee -> fetched by scripts/ats_fetch.py
#      web -> no public API; the web-scout agent visits 
#  = counts from the 2026-09-28 verification run. web-scout appends newly found boards at the end.
# web entries: `url` if known, else `search_hint` for web-scout to find the careers page.
# Built 2026-09-28 from: negarprh/Canadian-Tech-Internships-2027, SimplifyJobs listings (Canada, last year),
# speedyapply 2027-AI-College-Jobs (international), web research on Ottawa and Canadian AI employers.
aggregators:
- name: intern-list.com (Jobright)
  fetcher: scripts/intern_list.py
  lists:
  - ca_ml_ai
  - ca_swe
  - us_ml_ai
  note: Airtable-backed lists, re-read on every run. Rows link to jobright.ai; dedupe merges them with ATS postings.
- name: Canadian-Tech-Internships-2027
  url: https://raw.githubusercontent.com/negarprh/Canadian-Tech-Internships-2027/main/README.md
  fetcher: web-scout
- name: SimplifyJobs listings
  url: https://raw.githubusercontent.com/SimplifyJobs/Summer2027-Internships/dev/.github/scripts/listings.json
  fetcher: web-scout
- name: speedyapply AI international
  url: https://raw.githubusercontent.com/speedyapply/2027-AI-College-Jobs/main/INTERN_INTL.md
  fetcher: web-scout
- name: Invest Ottawa job board
  url: https://techjobfinder.investottawa.ca/jobs
  fetcher: web-scout

